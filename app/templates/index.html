<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Career Intelligence Platform</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f7fa;
    margin:0;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#1f2937;
}

.tagline{
    text-align:center;
    color:#2563eb;
    font-size:20px;
    margin-bottom:40px;
}

.status{
    display:flex;
    justify-content:space-between;
    margin-bottom:40px;
}

.card{
    width:23%;
    text-align:center;
    padding:20px;
    border-radius:10px;
    background:#eef4ff;
}

.card h2{
    margin:0;
}

label{
    font-weight:bold;
}

input, textarea{

    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{

    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}

button:hover{

    background:#1d4ed8;

}

.footer{

    margin-top:40px;
    text-align:center;
    color:#888;

}

</style>

</head>

<body>

<div class="container">

<h1>Career Intelligence Platform</h1>

<div class="tagline">

Find → Match → Optimize → Apply

</div>

<div class="status">

<div class="card">
<h2>Find</h2>
✓
</div>

<div class="card">
<h2>Match</h2>
✓
</div>

<div class="card">
<h2>Optimize</h2>
✓
</div>

<div class="card">
<h2>Apply</h2>
⏳
</div>

</div>

<label>Candidate Name</label>

<input type="text" value="Shankar Gautam">

<label>Company</label>

<input type="text">

<label>Job Title</label>

<input type="text">

<label>ATS Score</label>

<input type="number">

<label>Optimized Resume</label>

<textarea rows="10"></textarea>

<button>

Generate Resume

</button>

<div class="footer">

Career Intelligence Platform v0.3

</div>

</div>

</body>

</html>
